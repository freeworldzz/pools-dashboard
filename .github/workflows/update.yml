name: Atualizar preços

on:
  schedule:
    - cron: '0 7 * * *'   # todos os dias às 07:00 UTC (08:00 Portugal inverno / 09:00 verão)
  workflow_dispatch:        # permite correr manualmente no GitHub

permissions:
  contents: write           # necessário para fazer commit + push

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Scraper — Robôs
        run: python scraper.py --categoria robots

      - name: Scraper — Bombas de Calor
        run: python scraper.py --categoria bombas

      - name: Scraper — Eletrólise de Sal
        run: python scraper.py --categoria sal

      - name: Commit & push (se houver alterações)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data.json
          git diff --cached --quiet || git commit -m "chore: preços atualizados $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
