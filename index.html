<style>
  :root {
    --bg: #f0f4f8;
    --card: #ffffff;
    --primary: #005fa3;
    --primary-dark: #004276;
    --text: #1a202c;
    --muted: #718096;
    --border: #e2e8f0;
    --green: #38a169;
    --red: #e53e3e;
    --yellow: #d69e2e;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
    --shadow-md: 0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }

  /* Layout */
  .page-wrap { max-width: 1600px; margin: 0 auto; padding: 20px; }
  header { background: var(--primary); color: #fff; padding: 16px 24px; border-radius: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 20px; font-weight: 700; }
  header .subtitle { font-size: 12px; opacity: .75; margin-top: 2px; }
  header .updated { font-size: 12px; opacity: .7; text-align: right; }

  /* Cards */
  .cards-row { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .card { background: var(--card); border-radius: 10px; padding: 18px 22px; box-shadow: var(--shadow); flex: 1; min-width: 160px; }
  .card .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 6px; }
  .card .value { font-size: 28px; font-weight: 700; color: var(--primary); }
  .card .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

  /* Section */
  .section { background: var(--card); border-radius: 10px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 20px; }
  .section h2 { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 14px; border-bottom: 2px solid var(--border); padding-bottom: 8px; }

  /* Grid */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  @media(max-width: 900px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

  /* Chart wrapper */
  .chart-wrap { position: relative; }

  /* Small multiples */
  .sm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .sm-card { background: #f7fafc; border-radius: 8px; padding: 10px 12px 8px; border: 1px solid var(--border); }
  .sm-card canvas { display: block; width: 100% !important; height: 148px !important; }
  .sm-title { font-size: 11px; font-weight: 700; color: var(--primary-dark); margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sm-no-data { color: var(--muted); font-size: 11px; font-style: italic; padding: 16px 0; text-align: center; }

  /* Filters */
  .filters { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .filters label { font-size: 12px; font-weight: 600; color: var(--muted); }
  .filters select, .filters input { font-size: 12px; padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px; background: #fff; color: var(--text); outline: none; }
  .filters select:focus, .filters input:focus { border-color: var(--primary); }

  /* Table */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { background: #f7fafc; font-weight: 700; text-align: right; padding: 8px 10px; border-bottom: 2px solid var(--border); white-space: nowrap; position: sticky; top: 0; z-index: 1; }
  th:first-child { text-align: left; }
  td { padding: 6px 10px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
  td:first-child { text-align: left; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
  tr:hover td { background: #f7fafc; }
  .pm-cell { font-weight: 700; }
  .cell-cheapest { background: #c6f6d5 !important; color: #276749; font-weight: 700; border-radius: 4px; }
  .cell-expensive { background: #fff5f5 !important; color: #c53030; }
  .cell-na { color: #bbb; font-style: italic; }
  .cell-min { font-weight: 700; color: var(--primary); }
  .diff-pos { color: var(--red); }
  .diff-neg { color: var(--green); }
  .diff-zero { color: var(--muted); }

  /* Highlights */
  .highlights { display: flex; flex-wrap: wrap; gap: 12px; }
  .hl-card { background: linear-gradient(135deg, #ebf8ff 0%, #bee3f8 100%); border: 1px solid #90cdf4; border-radius: 8px; padding: 12px 16px; min-width: 220px; flex: 1; }
  .hl-card .robot-name { font-weight: 700; color: var(--primary-dark); font-size: 13px; margin-bottom: 4px; }
  .hl-card .hl-row { display: flex; justify-content: space-between; font-size: 11px; margin-top: 3px; color: #2c5282; }
  .hl-card .hl-badge { background: var(--green); color: #fff; font-size: 10px; font-weight: 700; border-radius: 4px; padding: 1px 6px; display: inline-block; margin-bottom: 4px; }
  .no-hl { color: var(--muted); font-style: italic; font-size: 13px; padding: 10px 0; }

  /* Tooltip override */
  .robot-link { color: var(--primary); text-decoration: none; font-weight: 600; }
  .robot-link:hover { text-decoration: underline; }

  /* Loading */
  .loading { text-align: center; padding: 60px; color: var(--muted); font-size: 16px; }
  .error-box { background: #fff5f5; border: 1px solid #fc8181; border-radius: 8px; padding: 20px; margin: 20px; color: #c53030; }
  .error-box code { font-size: 12px; background: #fed7d7; padding: 2px 6px; border-radius: 3px; display: block; margin-top: 8px; }

  /* Page tabs */
  .page-tabs { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .tab-btn { background:rgba(255,255,255,0.15); color:#fff; border:none; border-radius:6px; padding:7px 16px; font-size:13px; font-weight:600; cursor:pointer; transition:background .15s; white-space:nowrap; }
  .tab-btn:hover { background:rgba(255,255,255,0.28); }
  .tab-btn.active { background:#fff; color:var(--primary); }
</style>

<script>
// ---------------------------------------------------------------------------
// Constants
// ---------------------------------------------------------------------------
// ALL_VENDORS = lista completa; VENDORS = subconjunto ativo (definido por página).
// Vendedores sem qualquer preço numa categoria (bloqueados) são escondidos.
const ALL_VENDORS = (window.DASHBOARD_DATA || {}).vendors || [
  'Pools and More','Bricoandpool','Carol Piscina','Shop4Pool','Hidraulicart','IoT Pool'
];
let VENDORS = ALL_VENDORS;
const VENDOR_COLORS = {
  'Pools and More':       '#005fa3',
  'Bricoandpool':         '#e07b39',
  'Carol Piscina':        '#9b59b6',
  'Shop4Pool':            '#27ae60',
  'Hidraulicart':         '#e74c3c',
  'IoT Pool':             '#16a085',
  'Ferromar':             '#f4a261',
  'Outlet Piscinas':      '#6d6875',
  'PoolComet':            '#e9c46a',
  'Piscinas y Productos': '#ef233c',
  'MyPiscine':            '#2dc653',
  'Piscinarium':          '#c77dff',
  // fallback para lojas sem cor definida
  _default(v) { const h=v.split('').reduce((a,c)=>a+c.charCodeAt(0),0); const cols=['#e63946','#457b9d','#2a9d8f','#e9c46a','#f4a261','#264653','#a8dadc']; return cols[h%cols.length]; }
};

// Vendedores ativos numa categoria: P&M sempre + quem tiver ≥1 preço atual não-nulo
function activeVendors(items) {
  return ALL_VENDORS.filter((v, i) =>
    i === 0 || items.some(r => r.prices[v] && r.prices[v].current != null)
  );
}
const fmt = v => v == null ? null : '€' + v.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const fmtN = v => v == null ? '—' : fmt(v);

// ---------------------------------------------------------------------------
// Stats computation
// ---------------------------------------------------------------------------
function computeStats(robots) {
  return robots.map(robot => {
    const vendorPrices = {}; // vendor → current price (only non-null)
    VENDORS.forEach(v => {
      const pd = robot.prices[v];
      if (pd && pd.current != null) vendorPrices[v] = pd.current;
    });

    const sorted = Object.entries(vendorPrices).sort((a, b) => a[1] - b[1]);
    const minEntry  = sorted[0] || null;
    const min2Entry = sorted[1] || null;

    const pmPrice = vendorPrices['Pools and More'] ?? null;
    const minPrice  = minEntry  ? minEntry[1]  : null;
    const min2Price = min2Entry ? min2Entry[1] : null;
    const minVendor  = minEntry  ? minEntry[0]  : null;

    const pmIsMin = pmPrice != null && minPrice != null && pmPrice <= minPrice + 0.01;
    const pmMinDiff  = (pmPrice != null && minPrice  != null) ? pmPrice - minPrice  : null;
    const pmMin2Diff = (pmPrice != null && min2Price != null) ? pmPrice - min2Price : null;

    // Discount info for P&M
    const pmData = robot.prices['Pools and More'];
    const pmDiscount = pmData && pmData.before && pmData.current
      ? ((pmData.before - pmData.current) / pmData.before * 100)
      : null;

    return { ...robot, vendorPrices, sorted, minPrice, min2Price, minVendor, pmPrice, pmIsMin, pmMinDiff, pmMin2Diff, pmDiscount };
  });
}

function computeVendorStats(statsRobots) {
  const result = {};
  VENDORS.forEach(v => {
    result[v] = { cheapestCount: 0, discountCount: 0, discounts: [] };
  });

  statsRobots.forEach(r => {
    // cheapest
    if (r.minVendor) result[r.minVendor].cheapestCount++;

    // discounts
    VENDORS.forEach(v => {
      const pd = r.prices[v];
      if (pd && pd.current != null && pd.before != null && pd.before > pd.current) {
        const pct = (pd.before - pd.current) / pd.before * 100;
        result[v].discountCount++;
        result[v].discounts.push(pct);
      }
    });
  });

  VENDORS.forEach(v => {
    const d = result[v].discounts;
    result[v].avgDiscount = d.length ? d.reduce((a, b) => a + b, 0) / d.length : 0;
    result[v].maxDiscount = d.length ? Math.max(...d) : 0;
  });

  return result;
}

// ---------------------------------------------------------------------------
// Ghost-bar plugin for Chart.js
// ---------------------------------------------------------------------------
const ghostPlugin = {
  id: 'ghostBars',
  beforeDatasetsDraw(chart) {
    const ctx = chart.ctx;
    chart.data.datasets.forEach((ds, di) => {
      if (!ds.ghostData) return;
      const meta = chart.getDatasetMeta(di);
      const yScale = chart.scales.y;
      const baseY = yScale.getPixelForValue(yScale.min); // works for both zero and non-zero min
      meta.data.forEach((bar, i) => {
        const gv = ds.ghostData[i];
        if (!gv || !bar || gv <= yScale.min) return;
        const gy = yScale.getPixelForValue(Math.min(gv, yScale.max));
        const color = Array.isArray(ds.backgroundColor)
          ? ds.backgroundColor[i]
          : (VENDOR_COLORS[ds.vendorKey] || '#999');
        ctx.save();
        ctx.globalAlpha = 0.30;
        ctx.fillStyle = color;
        ctx.fillRect(bar.x - bar.width / 2, gy, bar.width, baseY - gy);
        ctx.restore();
      });
    });
  }
};
Chart.register(ghostPlugin);

// ---------------------------------------------------------------------------
// Chart customizado — escala independente por robô
// ---------------------------------------------------------------------------
function niceMax(val) {
  const lvls = [100,200,300,400,500,600,750,1000,1250,1500,2000,2500,3000,4000,5000,7500,10000,15000];
  return lvls.find(l => l >= val) || Math.ceil(val / 1000) * 1000;
}

let _hits = []; // hit targets para tooltip

function drawCustomPriceChart(statsRobots, filterText) {
  const filtered = filterText
    ? statsRobots.filter(r => norm(r.name).includes(norm(filterText)) || norm(r.brand).includes(norm(filterText)))
    : statsRobots;
  const robots = filtered.filter(r => VENDORS.some(v => r.prices[v]?.current != null));

  const canvas = document.getElementById('price-chart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  const BAR_W    = 10;
  const BAR_GAP  = 2;
  const GRP_PAD  = 18;
  const TOP_PAD  = 42;
  const BOT_PAD  = 52;
  const BAR_AREA = 270;
  const TOT_H    = TOP_PAD + BAR_AREA + BOT_PAD;
  const LPAD     = 10;

  const groupW = VENDORS.length * (BAR_W + BAR_GAP) + GRP_PAD;
  const W = Math.max(900, robots.length * groupW + LPAD * 2);

  canvas.width        = W;
  canvas.height       = TOT_H;
  canvas.style.width  = W + 'px';
  canvas.style.height = TOT_H + 'px';
  ctx.clearRect(0, 0, W, TOT_H);

  // Baseline
  ctx.strokeStyle = '#94a3b8';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(LPAD, TOP_PAD + BAR_AREA);
  ctx.lineTo(W - LPAD, TOP_PAD + BAR_AREA);
  ctx.stroke();

  _hits = [];

  robots.forEach((robot, ri) => {
    const gx       = LPAD + ri * groupW;
    const grpRight = gx + groupW - GRP_PAD;
    const baseY    = TOP_PAD + BAR_AREA;

    const allVals = VENDORS.flatMap(v => {
      const pd = robot.prices[v];
      return pd ? [pd.current, pd.before].filter(Boolean) : [];
    });
    if (!allVals.length) return;
    const scaleMax = niceMax(Math.max(...allVals));

    // Linha de referência (tracejada) no topo do grupo
    ctx.save();
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(gx, TOP_PAD);
    ctx.lineTo(grpRight, TOP_PAD);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    // Valor acima da linha
    ctx.save();
    ctx.font = 'bold 10px "Segoe UI",system-ui,sans-serif';
    ctx.fillStyle = '#4a5568';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText(scaleMax.toLocaleString('pt-PT'), gx + (grpRight - gx) / 2, TOP_PAD - 4);
    ctx.restore();

    // Barras
    VENDORS.forEach((v, vi) => {
      const pd  = robot.prices[v];
      const bx  = gx + vi * (BAR_W + BAR_GAP);
      const col = (VENDOR_COLORS[v]||VENDOR_COLORS._default(v)) || VENDOR_COLORS._default(v);

      // Ghost (antes do desconto)
      if (pd?.before && pd.before > (pd?.current ?? 0)) {
        const h = Math.round((pd.before / scaleMax) * BAR_AREA);
        ctx.save();
        ctx.globalAlpha = 0.28;
        ctx.fillStyle = col;
        ctx.fillRect(bx, baseY - h, BAR_W, h);
        ctx.restore();
      }

      // Barra actual
      if (pd?.current != null) {
        const h = Math.max(2, Math.round((pd.current / scaleMax) * BAR_AREA));
        ctx.fillStyle = col;
        ctx.fillRect(bx, baseY - h, BAR_W, h);

        // Valor rotado acima da barra
        ctx.save();
        ctx.translate(bx + BAR_W / 2, baseY - h - 2);
        ctx.rotate(-Math.PI / 2);
        ctx.font = '600 8px "Segoe UI",system-ui,sans-serif';
        ctx.fillStyle = col;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(Math.round(pd.current).toString(), 2, 0);
        ctx.restore();

        _hits.push({ x: bx, y: baseY - h, w: BAR_W, h, vendor: v, robotName: robot.name, current: pd.current, before: pd?.before ?? null });
      }
    });

    // Separador entre grupos
    ctx.save();
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 1;
    ctx.beginPath();
    const sx = gx + groupW - GRP_PAD / 2;
    ctx.moveTo(sx, TOP_PAD - 10);
    ctx.lineTo(sx, TOP_PAD + BAR_AREA);
    ctx.stroke();
    ctx.restore();

    // Nome do robô por baixo
    ctx.save();
    ctx.font = '600 10px "Segoe UI",system-ui,sans-serif';
    ctx.fillStyle = '#2d3748';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    const cx = gx + (grpRight - gx) / 2;
    const avail = grpRight - gx + 4;
    let name = robot.name;
    while (name.length > 4 && ctx.measureText(name).width > avail) name = name.slice(0, -1);
    if (name !== robot.name) name += '…';
    ctx.fillText(name, cx, baseY + 8);
    ctx.restore();
  });
}

function renderDiscountChart(vendorStats) {
  return {
    labels: VENDORS,
    datasets: [{
      label: 'Robôs em desconto',
      data: VENDORS.map(v => vendorStats[v].discountCount),
      backgroundColor: VENDORS.map(v => (VENDOR_COLORS[v]||VENDOR_COLORS._default(v))),
      borderRadius: 4,
    }]
  };
}

function renderAvgMaxChart(vendorStats) {
  return {
    labels: VENDORS,
    datasets: [
      {
        label: 'Desconto médio (%)',
        data: VENDORS.map(v => +vendorStats[v].avgDiscount.toFixed(1)),
        backgroundColor: VENDORS.map(v => (VENDOR_COLORS[v]||VENDOR_COLORS._default(v))),
        borderRadius: 4,
        order: 2,
      },
      {
        label: 'Desconto máximo (%)',
        data: VENDORS.map(v => +vendorStats[v].maxDiscount.toFixed(1)),
        backgroundColor: VENDORS.map(v => (VENDOR_COLORS[v]||VENDOR_COLORS._default(v)) + '55'),
        borderRadius: 4,
        order: 3,
      }
    ]
  };
}

function norm(s) { return (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }

// ---------------------------------------------------------------------------
// DOM builders
// ---------------------------------------------------------------------------
function buildCards(statsRobots, vendorStats) {
  const total = statsRobots.length;
  const pmLowest = statsRobots.filter(r => r.pmIsMin).length;
  const pmPct = total ? Math.round(pmLowest / total * 100) : 0;
  const withMatches = statsRobots.filter(r => Object.keys(r.vendorPrices).length > 1).length;
  const pmDiscounted = statsRobots.filter(r => r.pmDiscount != null).length;

  return `<div class="cards-row">
    <div class="card">
      <div class="label">Total de Robôs</div>
      <div class="value">${total}</div>
      <div class="sub">${withMatches} com dados de concorrentes</div>
    </div>
    <div class="card">
      <div class="label">P&amp;M tem preço mais baixo</div>
      <div class="value" style="color:var(--green)">${pmLowest}</div>
      <div class="sub">de ${total} robôs (${pmPct}%)</div>
    </div>
    <div class="card">
      <div class="label">Robôs em desconto (P&amp;M)</div>
      <div class="value" style="color:var(--yellow)">${pmDiscounted}</div>
      <div class="sub">de ${total} robôs</div>
    </div>
    ${VENDORS.slice(1).map(v => `
    <div class="card">
      <div class="label" style="color:${(VENDOR_COLORS[v]||VENDOR_COLORS._default(v))}">${v}</div>
      <div class="value" style="font-size:20px">${vendorStats[v].cheapestCount}</div>
      <div class="sub">preços mais baixos</div>
    </div>`).join('')}
  </div>`;
}

function buildTable(statsRobots) {
  const rows = statsRobots.map(r => {
    const pmUrl = r.prices['Pools and More']?.url;
    const robotCell = pmUrl
      ? `<a class="robot-link" href="${pmUrl}" target="_blank" title="${r.name}">${r.name}</a>`
      : `<span title="${r.name}">${r.name}</span>`;

    const vendorCells = VENDORS.map(v => {
      const pd = r.prices[v];
      if (!pd || pd.current == null) return `<td class="cell-na">N/D</td>`;
      const isMin = r.minVendor === v;
      const isPM  = v === 'Pools and More';
      let cls = '';
      if (isPM && r.pmIsMin) cls = 'pm-cell cell-cheapest';
      else if (isPM) cls = 'pm-cell cell-expensive';
      else if (isMin) cls = 'cell-cheapest';
      const disc = pd.before && pd.before > pd.current
        ? ` <span style="font-size:10px;color:var(--green)">-${Math.round((pd.before-pd.current)/pd.before*100)}%</span>`
        : '';
      return `<td class="${cls}">${fmtN(pd.current)}${disc}</td>`;
    }).join('');

    const minCell  = r.minPrice  != null ? `<td class="cell-min">${fmt(r.minPrice)}</td>`  : `<td class="cell-na">N/D</td>`;
    const min2Cell = r.min2Price != null ? `<td>${fmt(r.min2Price)}</td>` : `<td class="cell-na">N/D</td>`;

    const diffCell = r.pmMinDiff != null ? (() => {
      const d = r.pmMinDiff;
      const cls = d > 0.5 ? 'diff-pos' : d < -0.5 ? 'diff-neg' : 'diff-zero';
      const prefix = d > 0.5 ? '+' : '';
      return `<td class="${cls}">${prefix}${fmt(d)}</td>`;
    })() : `<td class="cell-na">N/D</td>`;

    const diff2Cell = r.pmMin2Diff != null ? (() => {
      const d = r.pmMin2Diff;
      const cls = d > 0.5 ? 'diff-pos' : d < -0.5 ? 'diff-neg' : 'diff-zero';
      const prefix = d > 0.5 ? '+' : '';
      return `<td class="${cls}">${prefix}${fmt(d)}</td>`;
    })() : `<td class="cell-na">N/D</td>`;

    return `<tr>
      <td title="${r.name}">${robotCell}</td>
      ${vendorCells}
      ${minCell}
      ${diffCell}
      ${min2Cell}
      ${diff2Cell}
    </tr>`;
  }).join('');

  return `<table>
    <thead>
      <tr>
        <th>Robô</th>
        ${VENDORS.map(v => `<th style="color:${(VENDOR_COLORS[v]||VENDOR_COLORS._default(v))}">${v}</th>`).join('')}
        <th>Mínimo</th>
        <th>P&amp;M − Mín</th>
        <th>2.º Mínimo</th>
        <th>P&amp;M − 2.ºMín</th>
      </tr>
    </thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function buildHighlights(statsRobots) {
  // P&M cheapest AND distance to 2nd >= €20 or >= 5%
  const candidates = statsRobots.filter(r => {
    if (!r.pmIsMin || r.min2Price == null) return false;
    const dist = r.min2Price - r.pmPrice;
    return dist >= 20 || dist / r.min2Price >= 0.05;
  }).sort((a, b) => {
    const da = a.min2Price - a.pmPrice;
    const db = b.min2Price - b.pmPrice;
    return db - da;
  });

  if (!candidates.length) {
    return `<div class="no-hl">Nenhum robô com vantagem significativa (≥€20 ou ≥5% abaixo do 2.º mais barato).</div>`;
  }

  return `<div class="highlights">${candidates.map(r => {
    const dist = r.min2Price - r.pmPrice;
    const distPct = (dist / r.min2Price * 100).toFixed(1);
    const v2 = r.sorted[1] ? r.sorted[1][0] : '—';
    return `<div class="hl-card">
      <div class="hl-badge">P&amp;M mais barato</div>
      <div class="robot-name">${r.name}</div>
      <div class="hl-row"><span>P&amp;M</span><strong>${fmtN(r.pmPrice)}</strong></div>
      <div class="hl-row"><span>2.º (${v2})</span><span>${fmtN(r.min2Price)}</span></div>
      <div class="hl-row"><span>Vantagem</span><strong style="color:var(--green)">-${fmt(dist)} (${distPct}%)</strong></div>
    </div>`;
  }).join('')}</div>`;
}

// ---------------------------------------------------------------------------
// Main render
// ---------------------------------------------------------------------------
async function init() {
  const root = document.getElementById('root');
  const data = window.DASHBOARD_DATA;
  if (!data) {
    root.innerHTML = `<div class="error-box">
      <strong>Dados não encontrados</strong><br>
      Corre o scraper para gerar <code>dashboard_data.js</code>:<br>
      <code>python scraper.py</code><br><br>
      Depois abre novamente este ficheiro no browser.
    </div>`;
    return;
  }

  document.getElementById('updated-at').innerHTML =
    `Atualizado em<br><strong>${data.generated_at.replace('T', ' ')}</strong>`;

  function renderPage(items) {
    // Esconde vendedores bloqueados (sem qualquer preço nesta categoria)
    VENDORS = activeVendors(items);
    const statsRobots = computeStats(items);
    const vendorStats = computeVendorStats(statsRobots);

    root.innerHTML = `
    ${buildCards(statsRobots, vendorStats)}

    <!-- Main price chart -->
    <div class="section">
      <h2>Preços por Produto e Vendedor <span style="font-weight:400;font-size:12px;color:var(--muted)">(valor no topo de cada barra; faixa transparente = preço antes do desconto)</span></h2>
      <div class="filters">
        <label>Filtrar:</label>
        <input type="text" id="filter-input" placeholder="Nome ou marca…" style="width:220px"/>
        <label>Marca:</label>
        <select id="brand-filter"><option value="">Todas</option></select>
      </div>
      <div id="price-legend" style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;font-size:11px;"></div>
      <div style="overflow-x:auto">
        <canvas id="price-chart"></canvas>
      </div>
    </div>

    <!-- Pie + discount bar -->
    <div class="grid-2">
      <div class="section">
        <h2>N.º de preços mais baixos por vendedor</h2>
        <div class="chart-wrap" style="height:280px">
          <canvas id="pie-chart"></canvas>
        </div>
      </div>
      <div class="section">
        <h2>Produtos em desconto por vendedor</h2>
        <div class="chart-wrap" style="height:280px">
          <canvas id="discount-count-chart"></canvas>
        </div>
      </div>
    </div>

    <!-- Avg/max discount -->
    <div class="section">
      <h2>Desconto médio e máximo por vendedor <span style="font-weight:400;font-size:12px;color:var(--muted)">(barra transparente = máximo)</span></h2>
      <div class="chart-wrap" style="height:280px">
        <canvas id="avg-max-chart"></canvas>
      </div>
    </div>

    <!-- Table -->
    <div class="section">
      <h2>Tabela comparativa de preços</h2>
      <div class="table-wrap" id="table-container"></div>
    </div>

    <!-- Highlights -->
    <div class="section">
      <h2>Vantagens competitivas da Pools&amp;More <span style="font-weight:400;font-size:12px;color:var(--muted)">(preço mais baixo com margem ≥€20 ou ≥5% face ao 2.º mais barato)</span></h2>
      <div id="highlights-container"></div>
    </div>
  `;

    // Fill brand filter
    const brands = [...new Set(items.map(r => r.brand).filter(Boolean))].sort();
    const brandSel = document.getElementById('brand-filter');
    brands.forEach(b => {
      const opt = document.createElement('option');
      opt.value = b; opt.textContent = b.charAt(0).toUpperCase() + b.slice(1);
      brandSel.appendChild(opt);
    });

    // Table + highlights
    document.getElementById('table-container').innerHTML = buildTable(statsRobots);
    document.getElementById('highlights-container').innerHTML = buildHighlights(statsRobots);

    // -- Price chart --
    const legend = document.getElementById('price-legend');
    VENDORS.forEach(v => {
      const el = document.createElement('span');
      el.style.cssText = 'display:flex;align-items:center;gap:4px;cursor:default';
      el.innerHTML = `<span style="width:12px;height:12px;border-radius:2px;background:${(VENDOR_COLORS[v]||VENDOR_COLORS._default(v))};display:inline-block"></span><span>${v}</span>`;
      legend.appendChild(el);
    });

    const tip = document.createElement('div');
    tip.style.cssText = 'position:fixed;background:#1a202c;color:#fff;font-size:11px;padding:6px 10px;border-radius:6px;pointer-events:none;display:none;z-index:999;line-height:1.5';
    document.body.appendChild(tip);

    const priceCanvas = document.getElementById('price-chart');
    priceCanvas.addEventListener('mousemove', e => {
      const rect = priceCanvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const hit = _hits.find(h => mx >= h.x && mx <= h.x + h.w && my >= h.y && my <= h.y + h.h);
      if (hit) {
        tip.style.display = 'block';
        tip.style.left = (e.clientX + 12) + 'px';
        tip.style.top  = (e.clientY - 28) + 'px';
        let html = `<strong>${hit.vendor}</strong><br>${hit.robotName}<br>Atual: <strong>${fmtN(hit.current)}</strong>`;
        if (hit.before) html += `<br>Antes: ${fmtN(hit.before)}`;
        tip.innerHTML = html;
      } else {
        tip.style.display = 'none';
      }
    });
    priceCanvas.addEventListener('mouseleave', () => { tip.style.display = 'none'; });

    let filterTimer;
    document.getElementById('filter-input').addEventListener('input', e => {
      clearTimeout(filterTimer);
      filterTimer = setTimeout(() => drawCustomPriceChart(statsRobots, e.target.value || brandSel.value), 200);
    });
    brandSel.addEventListener('change', e => {
      document.getElementById('filter-input').value = '';
      drawCustomPriceChart(statsRobots, e.target.value);
    });
    drawCustomPriceChart(statsRobots, '');

    // -- Pie chart --
    new Chart(document.getElementById('pie-chart'), {
      type: 'pie',
      data: {
        labels: VENDORS,
        datasets: [{
          data: VENDORS.map(v => vendorStats[v].cheapestCount),
          backgroundColor: VENDORS.map(v => (VENDOR_COLORS[v]||VENDOR_COLORS._default(v))),
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'right', labels: { boxWidth: 12, font: { size: 11 } } },
          tooltip: { callbacks: { label: ctx => `${ctx.label}: ${ctx.raw} produtos` } }
        }
      }
    });

    // -- Discount count bar --
    const dc = renderDiscountChart(vendorStats);
    new Chart(document.getElementById('discount-count-chart'), {
      type: 'bar',
      data: dc,
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx => `${ctx.raw} produtos em desconto` } }
        },
        scales: {
          x: { ticks: { font: { size: 11 } } },
          y: { beginAtZero: true, ticks: { stepSize: 1 } }
        }
      }
    });

    // -- Avg/max discount bar --
    const am = renderAvgMaxChart(vendorStats);
    new Chart(document.getElementById('avg-max-chart'), {
      type: 'bar',
      data: am,
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'top', labels: { boxWidth: 12, font: { size: 11 } } },
          tooltip: { callbacks: { label: ctx => `${ctx.dataset.label}: ${ctx.raw}%` } }
        },
        scales: {
          x: { ticks: { font: { size: 11 } } },
          y: { beginAtZero: true, ticks: { callback: v => v + '%' } }
        }
      }
    });
  } // end renderPage

  // Page tab switching
  document.querySelectorAll('#page-tabs .tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#page-tabs .tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const pageMap = {
        robots:            data.robots            || [],
        heat_pumps:        data.heat_pumps        || [],
        salt_electrolysis: data.salt_electrolysis || [],
      };
      const items = pageMap[btn.dataset.page] || [];
      if (!items.length) {
        root.innerHTML = `<div class="section" style="text-align:center;padding:60px;color:var(--muted)">
          <p style="font-size:15px">Sem dados para <strong>${btn.textContent.trim()}</strong>.</p>
          <p style="margin-top:10px;font-size:13px">Corre o scraper para gerar os dados:<br><code style="background:#edf2f7;padding:4px 8px;border-radius:4px">python scraper.py</code></p>
        </div>`;
        return;
      }
      renderPage(items);
    });
  });

  renderPage(data.robots || []);
}

init();
</script>

</html>
